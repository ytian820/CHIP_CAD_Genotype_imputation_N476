version: 1.2
workflows:
  - name: initial_screen_autosomes
    subclass: WDL
    primaryDescriptorPath: /workflow/01_initial_screen_autosomes.wdl
    topic: Screen single-sample GRCh37 VCFs for autosomal biallelic SNPs.
  - name: initial_screen_chrX
    subclass: WDL
    primaryDescriptorPath: /workflow/02_initial_screen_chrX.wdl
    topic: Screen single-sample GRCh37 VCFs for chromosome X biallelic SNPs.
  - name: merge_N476_cohort
    subclass: WDL
    primaryDescriptorPath: /workflow/03_merge_N476_cohort.wdl
    topic: Merge screened GRCh37 VCFs separately for N476 autosomes and chromosome X.
  - name: autosome_variant_coarse_filtering
    subclass: WDL
    primaryDescriptorPath: /workflow/04_autosome_variant_coarse_filtering.wdl
    topic: Filter GRCh37 autosomal cohort variants with missingness above 5%; retain all samples.
  - name: sample_call_rate_and_relatedness
    subclass: WDL
    primaryDescriptorPath: /workflow/05a_sample_call_rate_and_relatedness.wdl
    topic: Report autosomal sample missingness and KING relatedness with suggested exclusion lists.
  - name: prepare_1kg_reference_data
    subclass: WDL
    primaryDescriptorPath: /workflow/prepare_1kg_reference_data.wdl
    topic: Download and decompress the 1KG Phase 3 GRCh37 reference and population and relatedness files.
  - name: ancestry_1kg_projection
    subclass: WDL
    primaryDescriptorPath: /workflow/05b_ancestry_1kg_projection.wdl
    topic: Build GRCh37 1KG reference PCA axes and project cohort samples onto the first 20 PCs.
  - name: ancestry_assignment
    subclass: WDL
    primaryDescriptorPath: /workflow/05c_ancestry_assignment.wdl
    topic: Assign 1KG super-population labels from projected PCs using random forest classification.
